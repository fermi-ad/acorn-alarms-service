[package]
name = "dpm-client"
version = "0.1.0"
edition = "2021"

[features]
default = ["mock"]
mock = []
live = []

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"

[build-dependencies]
tonic-build = "0.12"
