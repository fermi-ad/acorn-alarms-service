[package]
name = "grpc-alarms"
version = "0.2.1"
edition = "2024"

[dependencies]
chrono = "0.4"
futures = "0.3"
prost = "0.14"
ringmap = "0.2"
rust-env-var-lib = { git = "https://github.com/fermi-ad/rust-env-var-lib", tag = "v1.2.0" }
rust-grpc-lib = { git = "https://github.com/fermi-ad/rust-grpc-lib", tag = "v4.1.0" }
rust-pubsub-lib = { git = "https://github.com/fermi-ad/rust-pubsub-lib", tag = "v10.0.0", features = ["kafka", "redis-stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["time"] }
tonic = "0.14"
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
rust-grpc-lib = { git = "https://github.com/fermi-ad/rust-grpc-lib", tag = "v4.1.0", features = ["build"] }

[dev-dependencies]
rust-pubsub-lib = { git = "https://github.com/fermi-ad/rust-pubsub-lib", tag = "v10.0.0", features = ["kafka", "redis-stream", "testing-utils"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
