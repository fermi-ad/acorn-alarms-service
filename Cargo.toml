[package]
name = "acorn-alarms-service"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.101"
chrono = "0.4.43"
futures = "0.3.32"
prost = "0.14.3"
rust-env-var-lib = { git = "https://github.com/fermi-ad/rust-env-var-lib.git", tag = "v1.1.0" }
rust-pubsub-lib = { git = "https://github.com/fermi-ad/rust-pubsub-lib.git", tag = "v4.0.1" }
redis = { version = "1.0", features = ["tokio-comp"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["rt-multi-thread","macros"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tonic = "0.14.4"
tonic-prost = "0.14.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

[build-dependencies]
protoc-bin-vendored = "3.2"
tonic-prost-build = "0.14.4"
